# docker compose up -d   -> API em http://localhost:8010 (docs em /docs); BUILDER_PORT muda a porta do host
#                          (8010 porque a interface web do ux-deep-agents costuma ocupar a 8000)
# docker compose run --rm builder build --latest-ux-run --project /target   -> CLI
services:
  builder:
    build: .
    image: frontend-builder
    env_file: .env
    ports:
      - "${BUILDER_PORT:-8010}:8000"
    volumes:
      - ./workspace:/app/workspace
      - ${TARGET_PROJECT:-../deepagents_jobapplier}:/target
      - ${UX_WORKSPACE:-../../UX Project/ux-deep-agents/workspace}:/ux
