name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/guicondor1512-genai-bci/frontend-builder

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run --with mypy mypy app
      - name: Tests
        run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t frontend-builder .
      - name: Smoke
        run: docker run --rm frontend-builder --help
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (version, latest, sha)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f2)
          for TAG in "$VERSION" latest "sha-${GITHUB_SHA::7}"; do
            docker tag frontend-builder "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
    steps:
      - name: Deploy (webhook que puxa a nova imagem; pulado sem DEPLOY_HOOK)
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then echo "DEPLOY_HOOK nao configurado: sem deploy"; exit 0; fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" \
            -H 'content-type: application/json' \
            -d "{\"image\": \"$IMAGE:sha-${GITHUB_SHA::7}\", \"sha\": \"$GITHUB_SHA\"}"
